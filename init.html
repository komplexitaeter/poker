<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Agile Estimations Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="src/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="src/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="src/apple-touch-icon.png">
    <link rel="stylesheet" href="style/style.css?v=1.30" media="screen" />
    <script defer data-domain="poker.komplexitaeter.de" src="https://plausible.io/js/script.js"></script>
</head>
<body onload="loadInit()" style="opacity: 0">

    <!-- line icons for the header (stroke = current text color, so they follow light/dark) -->
    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    </svg>

    <header class="head">
        <a class="brand" href="https://komplexitaeter.de/tools" target="_blank"><img src="src/brand_dark.svg?v=2" id="brand" alt="Komplexitäter tools"/></a>
        <span class="prompt-line" aria-hidden="true">poker<span class="caret"></span></span>

        <span class="head-fill"></span>

        <nav class="topnav-bar" aria-label="Menu">
            <button type="button" id="feedback_btn" class="icon-btn" data-open="feedback" aria-label="Feedback" aria-expanded="false" aria-controls="menu"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg><span class="lbl">feedback</span></button>
            <button type="button" id="cmode_btn" class="icon-btn" aria-label="Switch light and dark mode" onclick="switchColorMode()"><svg class="i i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="i i-sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
        </nav>
    </header>

    <!-- B-51: the same menu panel as on the board, with the feedback section only
         (large screens: side panel on the right; phones: bottom sheet) -->
    <dialog id="menu" class="menu" aria-labelledby="menu_title">
        <header class="m-head">
            <h2 id="menu_title">Feedback</h2>
            <button type="button" id="menu_close" class="icon-btn" data-close aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
        </header>
        <div class="m-body">
            <section id="feedback_box" class="menu_sec" data-sec="feedback" data-title="Feedback" hidden>
                <label class="lab" for="feedback_txt">Feedback is your most powerful way to change the world. Please let us know how we might improve.</label>
                <textarea maxlength="1800" rows="8" id="feedback_txt" class="field"></textarea>
                <div class="row end">
                    <button type="button" class="btn-box primary" onclick="feedback_submit();">Send feedback</button>
                </div>
            </section>
        </div>
    </dialog>

    <form id="teamForm">
        <label for="teaminput">
        </label><input id="teaminput" class="" type="text" size="15" maxlength="40" placeholder=" What's your team's name?" name="searchName" autocomplete="off" spellcheck="false" tabindex="1" />
        <input id="teambtn" class="btn" type="submit" value="Create Team Board" tabindex="2" />
    </form>

    <ol class="instruction">
        <li>Create your teams poker board</li>
        <li>Share the link with your team mates</li>
        <li>Choose your desired deck of cards</li>
        <li>Have Fun!</li>
    </ol>

    <script src="script/script_feedback.js?v=1.18" type="text/javascript" defer></script>
    <script src="script/script_team.js?v=1.7" type="text/javascript" defer></script>
    <script src="script/script.js?v=2.16" type="text/javascript" defer></script>
</body>
</html>
