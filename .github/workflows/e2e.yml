name: E2E tests

# Full suite on every PR into release and on every push to release (tests the combination of merged PRs).
# Not on PRs release -> master: they carry a state that was already tested on release (Kai merges only if the
# last release run is green). Docs-only changes do not run the suite.
on:
  push:
    branches: [release]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [release]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # same version as staging and production (B-22)
        php: ['8.4']
    timeout-minutes: 15
    env:
      # MySQL comes preinstalled on the runner with root/root
      MYSQL_ADMIN: mysql -uroot -proot
    steps:
      - uses: actions/checkout@v4

      - name: Set working directory for the app copy
        run: echo "E2E_DIR=$RUNNER_TEMP/poker-e2e" >> "$GITHUB_ENV"

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none

      - name: Make sure php-fpm ${{ matrix.php }} is available
        run: |
          test -x /usr/sbin/php-fpm${{ matrix.php }} || sudo apt-get install -y -q php${{ matrix.php }}-fpm php${{ matrix.php }}-mysql
          echo "PHP_FPM=/usr/sbin/php-fpm${{ matrix.php }}" >> "$GITHUB_ENV"

      - name: Start MySQL
        run: sudo systemctl start mysql.service

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: tests/e2e
        # No --with-deps: the ubuntu-24.04 runner already ships the shared
        # libraries Chromium needs, so --with-deps only triggered a slow
        # apt-get on every run (not covered by the browser cache above, up to
        # ~12 min on a slow mirror). The browser binary itself is cached (B-32).
        run: npx playwright install chromium

      - name: Start app (nginx, php-fpm, MySQL schema, poker-msg)
        run: tests/e2e/setup.sh start

      - name: Run tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: PHP messages during the test run
        if: always()
        run: |
          for f in "$E2E_DIR"/logs/php-error.log "$E2E_DIR"/logs/poker-msg.log; do
            echo "== $f"
            sed -E 's/^\[[^]]*\] //' "$f" 2>/dev/null | grep -E 'PHP (Deprecated|Warning|Notice|Fatal)' | sort | uniq -c | sort -rn | head -40 || true
          done

      - name: No PHP fatals, deprecations or warnings in the app
        run: |
          log="$E2E_DIR/logs/php-error.log"   # only created if PHP logged anything
          if [ -f "$log" ] && grep -E 'PHP (Fatal|Deprecated|Warning)' "$log"; then
            echo "::error::PHP fatals, deprecations or warnings during the test run, see above"
            exit 1
          fi

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-php${{ matrix.php }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            ${{ env.E2E_DIR }}/logs/
          retention-days: 14
