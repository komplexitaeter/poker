<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agile Poker – fish tokens mockup</title>
<link rel="icon" href="../../src/favicon.ico" sizes="any">
<link rel="stylesheet" href="fish.css?v=1">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-watch" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7"/><path d="M12 14V10M10 3h4M12 3v4M18 7l1.5-1.5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="1"/><path d="M3 7h18v3H3zM12 7v13M12 7c-2-4-6-4-6-1.5S10 7 12 7zM12 7c2-4 6-4 6-1.5S14 7 12 7z"/></symbol>
    <symbol id="i-renew" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.4 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <!-- the shield of the fish blocker: a sketched shield with a crossed-out fish feeling -->
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 2.8v5.6c0 4.6-3.2 8.2-7.5 9.6-4.3-1.4-7.5-5-7.5-9.6V5.8z"/><path d="M8.2 12.4c1.7-2 4.6-2 6.4 0-1.8 2-4.7 2-6.4 0zM14.6 12.4l2-1.4v2.8z"/></symbol>
    <!-- a token: a gold coin with a fish engraved (colours: --gold* tokens in fish.css) -->
    <symbol id="i-tok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" style="fill:var(--gold-deep);stroke:none"/><circle cx="12" cy="12" r="8" style="fill:var(--gold);stroke:var(--gold-rim);stroke-width:.8"/><path d="M6.6 12c2.2-2.8 6.1-2.9 8.4 0-2.3 2.9-6.2 2.8-8.4 0zM15 12l2.6-2v4zM9.1 11.3h.01" style="fill:none;stroke:var(--gold-ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/></symbol>
</svg>

<header class="head">
    <span class="brand"><img id="brand" src="../../src/brand_dark.svg" alt="Komplexitäter"></span>
    <span class="team">Team Fishbowl</span>
    <span class="btn-invite"><svg class="i"><use href="#i-share"/></svg><span class="lbl">Invite</span></span>
    <nav class="nav" aria-label="Menu">
        <span class="nv"><svg class="i"><use href="#i-list"/></svg><span class="lbl">topic</span></span>
        <span class="nv"><svg class="i"><use href="#i-watch"/></svg><span class="lbl">timer</span></span>
        <span class="nv"><svg class="i"><use href="#i-sliders"/></svg><span class="lbl">board</span></span>
        <button type="button" class="nv" id="navYou" aria-expanded="false" aria-controls="menu"><svg class="i"><use href="#i-user"/></svg><span class="lbl">you</span><span class="you-tok" id="youTok" hidden></span></button>
        <span class="nv"><svg class="i"><use href="#i-chat"/></svg><span class="lbl">feedback</span></span>
        <button type="button" class="nv" id="btnMode" aria-label="Light / dark"><svg class="i"><use href="#i-moon"/></svg></button>
    </nav>
</header>

<div class="page">
    <main class="table" id="table" aria-label="Table">
        <p class="topic"><span class="sl">topic</span> Export orders as CSV</p>
        <div class="cbox" id="cbox"></div>
    </main>
    <!-- the You menu (right panel on large screens, bottom sheet on phones) -->
    <section class="menu" id="menu" aria-labelledby="menuTitle" hidden>
        <div class="m-head"><h2 id="menuTitle">You</h2><button type="button" class="icon-btn" id="menuClose" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
        <div class="m-body" id="menuBody"></div>
    </section>
</div>

<!-- the emoji bar at a card (like #react_bar, plus tokens) -->
<div id="bar" class="tbl-pop react-bar" role="menu" aria-labelledby="barLabel" hidden></div>

<!-- fake checkout -->
<div class="scrim" id="checkout" hidden>
    <div class="paddle" role="dialog" aria-modal="true" aria-labelledby="payTitle" id="payBox"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- mockup handle (not part of the app): key M -->
<button class="mock-handle" id="mockHandle" aria-expanded="false" aria-controls="mockPanel" title="Mockup states (key M)">mock (M)</button>
<div class="mock-panel" id="mockPanel" role="dialog" aria-label="Mockup states" hidden>
    <div class="mp-row"><span>State</span><span class="grp" data-m="state"><button data-val="board">board</button><button data-val="bar">bar</button><button data-val="load">load</button><button data-val="support">support</button><button data-val="checkout">checkout</button><button data-val="code">code</button><button data-val="blocker">blocker</button></span></div>
    <div class="mp-row"><span>Mode</span><span class="grp" data-m="mode"><button data-val="dark">dark</button><button data-val="light">light</button></span></div>
    <div class="mp-row"><span>Motion</span><span class="grp" data-m="motion"><button data-val="full">full</button><button data-val="reduced">reduced</button></span></div>
    <div class="mp-row"><span>Incoming</span><span class="acts"><button data-act="vfFish">vf → 🐟 you</button><button data-act="vfHeart">vf → ❤️ you</button></span></div>
    <div class="mp-row"><span>Outgoing</span><span class="acts"><button data-act="meKim">you → 🐟 Kim (has blocker)</button><button data-act="meOle">you → 🐟 Ole</button></span></div>
    <div class="mp-row"><span>Team</span><span class="acts"><button data-act="chaos" id="actChaos">auto chaos: off</button><button data-act="gift">open gift link</button></span></div>
    <div class="mp-row"><span>Data</span><span class="acts"><button data-act="rich">wallet 37 + loaded</button><button data-act="empty">empty wallet</button><button data-act="reset">reset day</button></span></div>
    <p class="mp-foot"><a href="../">all mockups</a> · <a href="#" id="mpLink">link to this state</a> · <a href="concept.html">how it works technically →</a></p>
</div>

<script src="fish.js?v=1"></script>
</body>
</html>
