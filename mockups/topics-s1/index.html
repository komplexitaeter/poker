<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agile Poker – topic list S1 mockup (B-52)</title>
<link rel="icon" href="../../src/favicon.ico" sizes="any">
<link rel="stylesheet" href="topics.css?v=1">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-watch" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7"/><path d="M12 14V10M10 3h4M12 3v4M18 7l1.5-1.5"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></symbol>
    <symbol id="i-reopen" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/></symbol>
</svg>

<header class="head">
    <button class="m-only icon-btn" id="btnMenu" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
    <span class="brand"><img id="brand" src="../../src/brand_dark.svg" alt="Komplexitäter"></span>
    <span class="team">Team Example</span>
    <span class="btn-invite d-only"><svg class="i"><use href="#i-share"/></svg>Invite</span>
    <svg class="i d-only"><use href="#i-qr"/></svg>
    <nav class="nav d-only" aria-label="Menu">
        <button id="navTopics"><svg class="i"><use href="#i-list"/></svg><b>:</b>topics</button>
        <span><svg class="i"><use href="#i-watch"/></svg><b>:</b>timer</span>
        <span><svg class="i"><use href="#i-board"/></svg><b>:</b>board</span>
        <span><svg class="i"><use href="#i-user"/></svg><b>:</b>you</span>
        <span><svg class="i"><use href="#i-chat"/></svg><b>:</b>feedback</span>
        <button id="btnMode" aria-label="Light / dark"><svg class="i"><use href="#i-moon"/></svg></button>
    </nav>
</header>

<div class="page">
    <main class="table" id="table" aria-label="Table"></main>
    <aside class="sidebar" id="sidebar" aria-label="Round"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <section class="panel" id="panel" aria-labelledby="pTitle" hidden></section>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- mockup handle (not part of the app): key M -->
<button class="mock-handle" id="mockHandle" aria-expanded="false" aria-controls="mockPanel" title="Mockup states (key M)">mock (M)</button>
<div class="mock-panel" id="mockPanel" role="dialog" aria-label="Mockup states" hidden>
    <div class="mp-row"><span>State</span><span class="grp" data-m="state"><button data-val="single">1 one topic</button><button data-val="list">2 list</button><button data-val="voting">3 voting</button><button data-val="results">4 results</button><button data-val="traffic">5 traffic</button></span></div>
    <div class="mp-row"><span>Menu</span><span class="grp" data-m="menu"><button data-val="1">open</button><button data-val="0">closed</button></span></div>
    <div class="mp-row"><span>Edit</span><span class="grp" data-m="edit"><button data-val="0">no</button><button data-val="1">item 2 open</button></span></div>
    <div class="mp-row"><span>Timeline</span><span class="grp" data-m="hint"><button data-val="1">hint</button><button data-val="0">none</button></span></div>
    <div class="mp-row"><span>Mode</span><span class="grp" data-m="mode"><button data-val="dark">dark</button><button data-val="light">light</button></span></div>
    <p class="mp-foot"><a href="../">all mockups</a> · <a href="#" id="mpLink">link to this state</a></p>
</div>

<script src="topics.js?v=1"></script>
</body>
</html>
