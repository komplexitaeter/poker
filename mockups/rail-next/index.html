<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agile Poker – "Next item" in the collapsed sidebar (B-52 S1b)</title>
<link rel="icon" href="../../src/favicon.ico" sizes="any">
<link rel="stylesheet" href="../topics-s1/topics.css?v=1">
<link rel="stylesheet" href="rail.css?v=1">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-watch" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7"/><path d="M12 14V10M10 3h4M12 3v4M18 7l1.5-1.5"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-dleft" viewBox="0 0 24 24"><path d="M12 6l-6 6 6 6M19 6l-6 6 6 6"/></symbol>
    <symbol id="i-dright" viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M12 6l6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <!-- new: "skip to the next item" (chevron against a bar) and "finish" (flag) -->
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6 6l7 6-7 6M17 6v12"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 4h11l-2.5 4.5L17 13H6"/></symbol>
</svg>

<header class="head">
    <span class="brand"><img id="brand" src="../../src/brand_dark.svg" alt="Komplexitäter"></span>
    <span class="team">Team Example</span>
    <span class="btn-invite"><svg class="i"><use href="#i-share"/></svg>Invite</span>
    <svg class="i"><use href="#i-qr"/></svg>
    <nav class="nav" aria-label="Menu">
        <span><svg class="i"><use href="#i-list"/></svg><b>:</b>topics</span>
        <span><svg class="i"><use href="#i-watch"/></svg><b>:</b>timer</span>
        <span><svg class="i"><use href="#i-board"/></svg><b>:</b>board</span>
        <span><svg class="i"><use href="#i-user"/></svg><b>:</b>you</span>
        <span><svg class="i"><use href="#i-chat"/></svg><b>:</b>feedback</span>
        <button id="btnMode" aria-label="Light / dark"><svg class="i"><use href="#i-moon"/></svg></button>
    </nav>
</header>

<div class="page rail-page" id="page">
    <main class="table" id="table" aria-label="Table"></main>
    <aside class="rail" id="rail" aria-label="Round (collapsed sidebar)"></aside>
    <section class="peek" id="peek" aria-label="Sidebar" hidden></section>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- mockup handle (not part of the app): key M -->
<button class="mock-handle" id="mockHandle" aria-expanded="false" aria-controls="mockPanel" title="Mockup states (key M)">mock (M)</button>
<div class="mock-panel" id="mockPanel" role="dialog" aria-label="Mockup states" hidden>
    <div class="mp-row"><span>View</span><span class="grp" data-m="view"><button data-val="board">board</button><button data-val="compare">compare all</button></span></div>
    <div class="mp-row"><span>Variant</span><span class="grp" data-m="v"><button data-val="a">A stack</button><button data-val="b">B split</button><button data-val="c">C item chip</button></span></div>
    <div class="mp-row"><span>Phase</span><span class="grp" data-m="phase"><button data-val="voting">voting</button><button data-val="revealed">revealed</button></span></div>
    <div class="mp-row"><span>Items</span><span class="grp" data-m="items"><button data-val="none">none</button><button data-val="first">1 of 3</button><button data-val="last">3 of 3 (last)</button></span></div>
    <div class="mp-row"><span>Overlay</span><span class="grp" data-m="peek"><button data-val="0">closed</button><button data-val="1">open (hover / click)</button></span></div>
    <div class="mp-row"><span>Mode</span><span class="grp" data-m="mode"><button data-val="dark">dark</button><button data-val="light">light</button></span></div>
    <p class="mp-foot"><a href="../">all mockups</a> · <a href="#" id="mpLink">link to this state</a></p>
</div>

<script src="rail.js?v=1"></script>
</body>
</html>
